name: Update jobs

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-jobs
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest

      - name: Collect, normalize, classify, validate
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/update_jobs.py --all

      - name: Validate production data
        run: python scripts/validate_jobs.py

      - name: Commit listing updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md data/jobs.json data/scraper_status.json data/archive
          if git diff --staged --quiet; then
            echo "No listing changes to commit"
          else
            git commit -m "chore: update internship listings"
            git push
          fi
