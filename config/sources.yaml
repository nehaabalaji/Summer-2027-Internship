# Source configuration. Enable a source only when a public, permitted feed exists.
# `source` is the registry key used by: python scripts/update_jobs.py --source amazon

- id: amazon
  company: Amazon
  source: amazon
  platform: amazon
  enabled: true
  career_url: https://www.amazon.jobs

- id: doordash
  company: DoorDash
  source: doordash
  platform: greenhouse
  board_token: doordashusa
  enabled: true
  career_url: https://job-boards.greenhouse.io/doordashusa

- id: instacart
  company: Instacart
  source: instacart
  platform: greenhouse
  board_token: instacart
  enabled: true
  career_url: https://boards.greenhouse.io/instacart

- id: airbnb
  company: Airbnb
  source: airbnb
  platform: greenhouse
  board_token: airbnb
  enabled: true
  career_url: https://boards.greenhouse.io/airbnb

- id: stripe
  company: Stripe
