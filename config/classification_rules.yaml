# Jobs must look like intern / co-op / new-grad / entry-level
# using source fields or these title/type keywords. We never guess.
early_career_title_keywords:
  - intern
  - internship
  - internships
  - co-op
  - coop
  - co op
  - new grad
  - new graduate
  - new-grad
  - entry level
  - entry-level
  - graduate intern
  - graduate program
  - summer analyst
  - industrial placement
  - placement student
  - associate product manager
  - apm

# If classification lands in Other, keep the job only when the TITLE
# contains a strong domain term. Generic words like "analyst" are not enough.
relevance_keywords:
  - supply chain
  - operations
  - operational
  - product manager
  - product management
  - product intern
  - procurement
  - sourcing
  - logistics
  - inventory
  - warehouse
  - fulfillment
  - manufacturing
  - production planning
  - vendor management
  - transportation
  - demand planning
  - supply planning
  - area manager
  - program manager
  - project manager

