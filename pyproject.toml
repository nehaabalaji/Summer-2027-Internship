[project]
name = "supply-chain-internships"
version = "0.1.0"
description = "A GitHub-first internship board for supply chain, operations, product, and related roles."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Supply Chain Internships contributors" }]
dependencies = [
  "httpx>=0.27,<0.29",
  "pydantic>=2.7,<3",
  "python-dateutil>=2.9,<3",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
